name: Release

# Builds the launcher from a tag for both Windows (.exe) and Linux
# (.AppImage), signs the Windows build with the ed25519 update key, and
# attaches everything to the GitHub release.
#
# Signing used to be a manual step run from a developer's machine, which
# made it possible to forget. It can't be forgotten any more: installed
# launchers refuse to apply an update that has no valid ".sig" companion
# (see app_launcher_update.go), so producing the signature has to be part
# of the same automation that publishes the exe. Self-update isn't
# implemented for Linux yet (see app_launcher_update_apply_other.go), so the
# AppImage ships unsigned — it's a manual download from the release page,
# not something an installed launcher fetches and applies itself.
#
# A tag with a "-suffix" (v1.11.0-beta, 1.11.0-rc1, ...) publishes as a
# draft pre-release instead of a public one — see the prepare job below.
#
# Required repository secret:
#   LAUNCHER_UPDATE_PRIVATE_KEY — contents of launcher_update_private.key
#     (the base64 line produced by `go run ./tools/updatesign -gen`).
#     It must be the private half of PublicKeyB64 in
#     internal/updatekey/updatekey.go; updatesign refuses to sign otherwise.

on:
  push:
    tags:
      # Both tag styles the repo has used so far ("v1.0.4" and "1.0.3"), plus
      # a "-suffix" for draft pre-releases ("v1.11.0-beta").
      - "v*"
      - "[0-9]*"

# Needed to create the release and attach the built artifacts to it.
permissions:
  contents: write

jobs:
  # Validates the tag, then creates the GitHub release (or reuses one
  # already drafted from the GitHub UI) exactly once, before either build
  # job uploads to it — running that step in both release-windows and
  # release-linux directly would race them against each other trying to
  # create the same release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The launcher reads its own version from frontend/package.json (see
      # version.go), while the update check compares it against the latest
      # release tag. If the two disagree, an updated launcher still reports
      # the old version and keeps offering the very update it just
      # installed — an update loop players can't get out of. Cheaper to
      # fail the release here. Only the "MAJOR.MINOR.PATCH" core is compared
      # for a pre-release tag ("1.11.0-beta" -> "1.11.0"): package.json
      # itself never carries a pre-release suffix.
      - name: Check the tag matches frontend/package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          core_version="${version%%-*}"
          pkg_version="$(jq -r .version frontend/package.json)"
          if [ "$core_version" != "$pkg_version" ]; then
            echo "Tag '$GITHUB_REF_NAME' is version '$core_version' but frontend/package.json says '$pkg_version'. Bump package.json to match the tag before releasing." >&2
            exit 1
          fi
          if [ "$version" != "$core_version" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing version $version"

      - name: Create the GitHub release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushing a bare tag doesn't create a release; publishing one from
          # the GitHub UI does. Handle both so the artifacts land either way
          # (release-windows/release-linux only ever upload to whatever
          # release ends up existing here).
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — reusing it."
            exit 0
          fi

          args=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            # This repo is public, so a plain "pre-release" flag alone
            # wouldn't hide anything from anyone — only a draft does: drafts
            # are only visible to people with write access to the repo, and
            # the launcher's own changelog/update-check (fetchReleases in
            # releases.go) can't see them either, since it queries the
            # GitHub API unauthenticated.
            args+=(--draft --prerelease)
            echo "Tag has a pre-release suffix — creating a draft pre-release (hidden from the public until manually published)."
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  release-windows:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Vet Go sources
        run: go vet ./...

      - name: Build
        run: wails build

      # Releases are published as "lethalmon-launcher.exe" (no version in the
      # name, so the download URL never changes between releases), while
      # wails.json builds "Lethal Launcher.exe".
      - name: Name the artifact after the release
        id: artifact
        run: |
          $artifact = "build/bin/lethalmon-launcher.exe"
          Move-Item -LiteralPath "build/bin/Lethal Launcher.exe" -Destination $artifact -Force
          "path=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Any step that rewrites the exe (Authenticode signing, in
      # particular) must run BEFORE this one — signing the file afterwards
      # would invalidate the signature produced here. The verify step below
      # is what catches that mistake.
      - name: Sign the launcher
        env:
          LAUNCHER_UPDATE_PRIVATE_KEY: ${{ secrets.LAUNCHER_UPDATE_PRIVATE_KEY }}
        run: |
          if (-not $env:LAUNCHER_UPDATE_PRIVATE_KEY) {
            throw "The LAUNCHER_UPDATE_PRIVATE_KEY secret is not set. Without it the release would ship an unsigned exe that no installed launcher accepts as an update."
          }
          # Written outside the workspace so no later step can pick it up
          # as a build artifact, and removed as soon as signing is done.
          $keyPath = Join-Path $env:RUNNER_TEMP "launcher_update_private.key"
          try {
            Set-Content -LiteralPath $keyPath -Value $env:LAUNCHER_UPDATE_PRIVATE_KEY -NoNewline -Encoding ascii
            go run ./tools/updatesign -sign "${{ steps.artifact.outputs.path }}" -key $keyPath
            if ($LASTEXITCODE -ne 0) { throw "updatesign failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      # Runs the same check an installed launcher runs before applying an
      # update, against the exact files about to be uploaded.
      - name: Verify the signature
        run: |
          go run ./tools/updatesign -verify "${{ steps.artifact.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed with exit code $LASTEXITCODE" }

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $artifact = "${{ steps.artifact.outputs.path }}"
          gh release upload $tag $artifact "$artifact.sig" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }

  release-linux:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Vet Go sources
        run: go vet ./...

      # -tags webkit2_41 targets webkit2gtk-4.1 (what current distros ship;
      # Wails defaults to the older 4.0 dev package, which isn't installed
      # above and wouldn't be found).
      - name: Build
        run: wails build -tags webkit2_41 -platform linux/amd64 -clean -nopackage

      # Produces build/bin/lethalmon-launcher-x86_64.AppImage — no version in
      # the name, matching the Windows exe's own stable download URL.
      - name: Package as AppImage
        run: ./tools/build-appimage.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" build/bin/lethalmon-launcher-x86_64.AppImage --clobber
